<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sva Natjecanja</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="index.html" class="brand">Sva Natjecanja</a>
      <span class="subtitle">Baza zadataka i rješenja</span>
    </div>
  </header>

  <main class="container">
    <section class="filter-bar">
      <div class="filter-group">
        <label for="razredFilter">1. Razred</label>
        <select id="razredFilter">
          <option value="svi">Svi razredi</option>
          <option value="1r">1. razred OŠ (1r)</option>
          <option value="2r">2. razred OŠ (2r)</option>
          <option value="3r">3. razred OŠ (3r)</option>
          <option value="4r">4. razred OŠ (4r)</option>
          <option value="5r">5. razred OŠ (5r)</option>
          <option value="6r">6. razred OŠ (6r)</option>
          <option value="7r">7. razred OŠ (7r)</option>
          <option value="8r">8. razred OŠ (8r)</option>
          <option value="1rs">1. razred SŠ (1rs)</option>
          <option value="2rs">2. razred SŠ (2rs)</option>
          <option value="3rs">3. razred SŠ (3rs)</option>
          <option value="4rs">4. razred SŠ (4rs)</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="predmetFilter">2. Predmet</label>
        <select id="predmetFilter">
          <option value="svi">Svi predmeti</option>
          <option value="hrj">Hrvatski jezik (hrj)</option>
          <option value="eng">Engleski jezik (eng)</option>
          <option value="mat">Matematika (mat)</option>
          <option value="fiz">Fizika (fiz)</option>
          <option value="kem">Kemija (kem)</option>
          <option value="pov">Povijest (pov)</option>
          <option value="geo">Geografija (geo)</option>
          <option value="bio">Biologija (bio)</option>
          <option value="inf">Informatika (inf)</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="razinaFilter">3. Razina</label>
        <select id="razinaFilter">
          <option value="sve">Sve razine</option>
          <option value="sko">Školsko (ško)</option>
          <option value="zup">Županijsko (žup)</option>
          <option value="drz">Državno (drž)</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="godinaFilter">4. Godina</label>
        <select id="godinaFilter">
          <option value="sve">Sve godine</option>
        </select>
      </div>
    </section>

    <div class="results-meta">
      <span id="resultsCount">Učitavanje...</span>
      <button type="button" id="resetBtn" class="btn-reset">Poništi filtere</button>
    </div>

    <section id="natjecanjaList" class="list-container">
      <!-- Automatski prikaz datoteka -->
    </section>
  </main>

  <script src="script.js?v=4"></script>
</body>
</html>
